name: Deploy to Hostinger

# Builds the two images (app and migrator) in GitHub, pushes them to GHCR, and runs deploy/deploy.sh on the VPS over SSH.
# Started by hand only, and the `production` environment holds it until a reviewer approves.
# No personal token is used: GHCR takes the job's own GITHUB_TOKEN, and the VPS logs in to GHCR with that same short-lived token.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  image:
    name: Build and push images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      app_image: ${{ steps.names.outputs.app_image }}
      migrate_image: ${{ steps.names.outputs.migrate_image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          {
            echo "tag=$(git rev-parse --short=12 HEAD)"
            echo "app_image=ghcr.io/${owner}/${repo}"
            echo "migrate_image=ghcr.io/${owner}/${repo}-migrate"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.app_image }}:${{ steps.names.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build and push the migrator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.migrate_image }}:${{ steps.names.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

  deploy:
    name: Deploy on the VPS
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned from a secret: the job never trusts whatever answers on first contact.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName ${VPS_HOST}"
            echo "  User ${VPS_USER}"
            echo "  Port ${VPS_PORT:-22}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config
      - name: Copy the compose file and the deploy script
        run: scp compose.prod.yaml deploy/deploy.sh vps:/opt/halcom/
      - name: Let the VPS pull the private images (token lives for this job only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | ssh vps "docker login ghcr.io -u github-actions --password-stdin"
      - name: Run the deploy script
        env:
          APP_IMAGE: ${{ needs.image.outputs.app_image }}
          MIGRATE_IMAGE: ${{ needs.image.outputs.migrate_image }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: ssh vps "APP_IMAGE='${APP_IMAGE}' MIGRATE_IMAGE='${MIGRATE_IMAGE}' IMAGE_TAG='${IMAGE_TAG}' bash /opt/halcom/deploy.sh"
      - name: Forget the registry login on the VPS
        if: always()
        run: ssh vps "docker logout ghcr.io" || true
