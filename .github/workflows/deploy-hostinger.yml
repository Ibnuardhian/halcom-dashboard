name: Deploy to Hostinger

# Sends the chosen commit to the VPS over SSH (git archive, so the VPS needs no GitHub token) and runs deploy/deploy-vps.sh there:
# build the images, dump the database, migrate, restart the app, check its health, roll back the image if it is not healthy.
# Starts when something is pushed to main (a merge counts) and by hand (any branch, tag or commit).
# The `production` environment holds every run until a reviewer approves it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy (a push to main always deploys that push)
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on the VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned from a secret: the job never trusts whatever answers on first contact.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName ${VPS_HOST}"
            echo "  User ${VPS_USER}"
            echo "  Port ${VPS_PORT:-22}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config
      - name: Copy the source, the compose file and the scripts
        run: |
          git archive --format=tar.gz HEAD | ssh vps "rm -rf /opt/halcom/src && mkdir -p /opt/halcom/src && tar -xz -C /opt/halcom/src"
          scp deploy/compose.hostinger.yaml deploy/Caddyfile deploy/deploy-vps.sh deploy/db-sync.sh vps:/opt/halcom/
      - name: Run the deploy script
        run: |
          tag="$(git rev-parse --short=12 HEAD)"
          ssh vps "IMAGE_TAG='${tag}' bash /opt/halcom/deploy-vps.sh"
